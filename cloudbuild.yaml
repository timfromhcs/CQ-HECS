# Google Cloud Build Pipeline for CQ-HECS Classical Four-Path Architecture
# Deterministic build, zero-silent-truncation audit, and bit-exact differential testing.

steps:
  # Step 1: Environment & Linting
  - name: 'python:3.11'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        pip install --upgrade pip
        pip install flake8
        python -m compileall cqhecs/ tests/
        flake8 cqhecs/ tests/test_four_path_architecture.py --count --select=E9,F63,F7,F82 --show-source --statistics

  # Step 2: Audit: Verify Zero Silent Truncation (chi=48 Elimination)
  - name: 'python:3.11'
    entrypoint: 'python'
    args: ['scripts/verify_no_silent_truncation.py']

  # Step 3: Four-Path Architecture & Differential Tests
  - name: 'python:3.11'
    entrypoint: 'bash'
    env:
      - 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1'
    args:
      - '-c'
      - |
        set -euo pipefail
        pip install numpy qiskit pytest setuptools wheel
        pip install -e .
        pytest tests/test_four_path_architecture.py -v

  # Step 4: Full Deterministic Test Suite
  - name: 'python:3.11'
    entrypoint: 'bash'
    env:
      - 'PYTEST_DISABLE_PLUGIN_AUTOLOAD=1'
    args:
      - '-c'
      - |
        set -euo pipefail
        pytest tests/ -v --durations=10

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
