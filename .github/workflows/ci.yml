name: CQ-HECS Deterministic CI & Four-Path Architecture Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  static-and-package:
    name: Static checks & package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install static-analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-py311.txt flake8 build

      - name: Compile all Python sources
        run: python -m compileall -q cqhecs tests scripts python_bridge

      - name: Lint for fatal Python errors
        run: |
          flake8 cqhecs tests scripts python_bridge --count --select=E9,F \
            --show-source --statistics

      - name: Verify version surfaces agree
        run: python scripts/check_version.py

      - name: Audit for silent truncation
        run: python scripts/verify_no_silent_truncation.py

      - name: Build wheel and sdist
        run: |
          python -m build
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Clean-environment wheel smoke test
        run: |
          python -m venv /tmp/package-venv
          /tmp/package-venv/bin/python -m pip install --upgrade pip
          /tmp/package-venv/bin/pip install dist/*.whl
          /tmp/package-venv/bin/cq-hecs --help >/dev/null
          /tmp/package-venv/bin/cq-hecs version
          /tmp/package-venv/bin/cq-hecs doctor
          /tmp/package-venv/bin/cq-hecs --format json run name:bell --shots 64 \
            > /tmp/package-run.json
          /tmp/package-venv/bin/python - <<'PY'
          import json
          with open("/tmp/package-run.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload["schema_version"], "missing schema_version"
          assert payload["result"]["counts"], "no counts returned"
          print("wheel smoke test OK:", payload["result"]["path"])
          PY

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: warn

  linux-native:
    name: Linux C++20, Vulkan & full Python suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install toolchain and Vulkan runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-12 libvulkan-dev \
            glslang-tools mesa-vulkan-drivers vulkan-tools libx11-xcb-dev \
            libxkbcommon-dev libwayland-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-py311.txt \
            numpy qiskit qiskit-aer stim pytest hypothesis psutil rich coverage flake8 \
            nanobind setuptools wheel qiskit-ibm-runtime
          pip install -e . --no-deps

      - name: Verify shader sources
        run: python scripts/verify_vulkan_shaders.py

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCQ_BUILD_TESTS=ON -DCQ_ENABLE_AVX2=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build native core and tests
        run: cmake --build build --config Release --parallel "$(nproc)"

      - name: Execute CTest suite
        run: |
          mkdir -p test-results
          ctest --test-dir build --output-on-failure --schedule-random \
            -j"$(nproc)" --output-junit test-results/ctest.xml

      - name: Verify Vulkan compute dispatch (software ICD allowed)
        env:
          CQ_REQUIRE_VULKAN: "1"
        run: |
          vulkaninfo --summary
          ctest --test-dir build -R '^test_vulkan_compute_contract$' -V

      - name: Full Python suite with branch coverage
        env:
          PYTHONPATH: .
          CQ_HECS_REQUIRE_NATIVE: "1"
        run: |
          mkdir -p test-results
          python -m coverage run --branch --source=cqhecs \
            -m pytest tests/ -q --junitxml=test-results/pytest.xml
          python -m coverage report -m --fail-under=70
          python -m coverage xml -o test-results/coverage.xml

      - name: Source-level mutation gate
        env:
          PYTHONPATH: .
        run: python scripts/run_mutation_tests.py

      - name: Metamorphic installation self-test
        env:
          PYTHONPATH: .
        run: python -m cqhecs.cli selftest --cases 4

      - name: Upload Linux test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-test-evidence
          path: |
            test-results/
            .coverage
          if-no-files-found: warn

  windows-native:
    name: Windows C++20, Vulkan & full Python suite
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          cache: true

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-py311.txt numpy qiskit qiskit-aer stim pytest hypothesis psutil rich coverage flake8 nanobind setuptools wheel
          pip install -e . --no-deps

      - name: Verify shader sources
        run: python scripts/verify_vulkan_shaders.py

      - name: Configure CMake
        shell: pwsh
        run: |
          $v_sdk = $env:VULKAN_SDK
          if (-not $v_sdk -or -not (Test-Path $v_sdk)) {
            $latest = Get-ChildItem -Path "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
            if ($latest) { $v_sdk = $latest.FullName }
          }
          if ($v_sdk) {
            Write-Host "Configuring CMake with Vulkan SDK: $v_sdk"
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCQ_BUILD_TESTS=ON `
              -DVulkan_INCLUDE_DIR="$v_sdk/Include" `
              -DVulkan_LIBRARY="$v_sdk/Lib/vulkan-1.lib"
          } else {
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCQ_BUILD_TESTS=ON
          }

      - name: Build native core and tests
        run: cmake --build build --config Release --parallel

      - name: Execute CTest suite
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          ctest --test-dir build -C Release --output-on-failure `
            --output-junit test-results/ctest.xml

      - name: Full Python suite
        env:
          PYTHONPATH: .
          CQ_HECS_REQUIRE_NATIVE: "1"
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          python -m pytest tests/ -q --junitxml=test-results/pytest.xml

      - name: Source-level mutation gate
        env:
          PYTHONPATH: .
        run: python scripts/run_mutation_tests.py

      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-evidence
          path: test-results/
          if-no-files-found: warn

  python-compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install newest supported dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy qiskit qiskit-aer stim pytest hypothesis psutil

      - name: Install package without native extension
        run: pip install -e . --no-deps

      - name: Run the Python suite (native-only tests skip visibly)
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -q

  sanitizers:
    name: Linux ASan + UBSan native tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install toolchain and Vulkan runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-12 libvulkan-dev \
            glslang-tools mesa-vulkan-drivers vulkan-tools libx11-xcb-dev \
            libxkbcommon-dev libwayland-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-py311.txt numpy nanobind setuptools wheel

      - name: Configure sanitizer build
        run: |
          cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCQ_BUILD_TESTS=ON -DCQ_ENABLE_SANITIZERS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build sanitizer targets
        run: cmake --build build-asan --parallel "$(nproc)"

      - name: Prove sanitizer flags reached core and test objects
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          entries = json.loads(
              Path("build-asan/compile_commands.json").read_text(encoding="utf-8")
          )
          required = ("src/qasm_parser.cpp", "tests/test_qasm_contract.cpp")
          for suffix in required:
              matching = [
                  entry for entry in entries
                  if entry["file"].replace("\\", "/").endswith(suffix)
              ]
              assert matching, f"no compile entry for {suffix}"
              assert all(
                  "-fsanitize=address,undefined" in entry["command"]
                  for entry in matching
              ), f"sanitizer flags missing for {suffix}: {matching[0]['command']}"
          print(f"sanitizer flags verified for {len(required)} objects")
          PY

      - name: Run parser, solver and hardening tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ctest --test-dir build-asan --output-on-failure \
            -R "^(test_qasm_contract|cq_hecs_cpp_hardening|test_constraint_solver|test_exact_algebra)$"

      - name: Upload sanitizer build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizer-logs
          path: |
            build-asan/Testing/
            build-asan/compile_commands.json
          if-no-files-found: warn

  web-emulator:
    name: Web emulator (WASM core, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rebuild the WebAssembly core from source
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          committed="$(sha256sum public/cqhecs_core.wasm | cut -d' ' -f1)"
          RUSTFLAGS="-C target-feature=+simd128,+bulk-memory" \
            cargo build --manifest-path wasm/Cargo.toml --release --target wasm32-unknown-unknown
          node scripts/copy-wasm.mjs
          rebuilt="$(sha256sum public/cqhecs_core.wasm | cut -d' ' -f1)"
          # A different rustc may emit different bytes; the tests below run on
          # the rebuilt core either way, so behaviour is checked from source.
          echo "committed=$committed rebuilt=$rebuilt"

      - name: Install dependencies
        run: npm ci

      - name: Correctness tests (Qiskit fixtures, independent reference)
        run: npm test

      - name: Type check and production build
        run: npm run build
