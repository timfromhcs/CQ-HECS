name: CQ-HECS Deterministic CI & Four-Path Architecture Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Ubuntu C++20, Vulkan & Classical Four-Path CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-12 libvulkan-dev glslang-tools \
            mesa-vulkan-drivers vulkan-tools libx11-xcb-dev libxkbcommon-dev libwayland-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy qiskit pytest nanobind setuptools wheel flake8

      - name: Code Quality & Syntax Linting
        run: |
          python -m compileall cqhecs/ tests/
          flake8 cqhecs/ tests/test_four_path_architecture.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: "Audit: Verify Zero Silent Truncation (chi=48 Elimination)"
        run: python scripts/verify_no_silent_truncation.py

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCQ_BUILD_TESTS=ON -DCQ_ENABLE_AVX2=ON

      - name: Build C++20 Core & Shaders
        run: cmake --build build --config Release --parallel $(nproc)

      - name: Execute CTest Zero-Mock Suite
        run: ctest --test-dir build --output-on-failure --schedule-random -j$(nproc)

      - name: Execute Four-Path Architecture & Differential Tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
          PYTHONPATH: .
        run: |
          pip install -e .
          pytest tests/test_four_path_architecture.py -v

      - name: Full Classical Test Suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
          PYTHONPATH: .
        run: pytest tests/ -v --durations=15
