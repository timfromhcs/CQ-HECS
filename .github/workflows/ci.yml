name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Install Vulkan SDK (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools glslc

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.3.250.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, glslc

      - name: Embed SPIR-V Shaders into C++ Headers
        run: python scripts/embed_shaders.py

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Targets
        run: cmake --build build --config Release --parallel

      - name: Run CTest Verification
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run Full Automated Test Discovery
        run: python -m unittest discover -s tests -v

      - name: Run PowerShell IPC Verification (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tests\test_powershell_ipc.ps1
