name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch rich pytest qiskit nanobind wheel setuptools

      - name: Install Vulkan SDK & SwiftShader (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools glslang-tools spirv-tools \
            libx11-xcb-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install vulkan-sdk -y --no-progress
          $vulkanDir = (Get-ChildItem -Path "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          echo "VULKAN_SDK=$vulkanDir" >> $env:GITHUB_ENV
          echo "$vulkanDir\Bin" >> $env:GITHUB_PATH

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCQHECS_BUILD_TESTS=ON -DCQHECS_HEADLESS=ON

      - name: Build Binaries and Shaders
        run: cmake --build build --config Release --parallel

      - name: Run CTest Suite (All Tests Must Pass)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run Python Automated Tests (65 Tests)
        run: python -m unittest discover -s tests -v

      - name: Run Pytest Suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
        run: python -m pytest tests/test_qiskit_and_transpiler.py -v

      - name: Run PowerShell IPC and CLI Tests (Windows Only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\bin\Release\cq_hecs.exe test
          powershell -ExecutionPolicy Bypass -File tests/test_powershell_ipc.ps1
