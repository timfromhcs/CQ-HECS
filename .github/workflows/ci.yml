name: CQ-HECS Production CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test-linux:
    name: Linux C++20 & Qiskit Verification (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-12 libvulkan-dev glslang-tools \
            mesa-vulkan-drivers vulkan-tools libx11-xcb-dev libxkbcommon-dev libwayland-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy qiskit pytest nanobind setuptools wheel

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCQ_BUILD_TESTS=ON \
            -DCQ_ENABLE_AVX2=ON

      - name: Build C++20 Core & Shaders
        run: cmake --build build --config Release --parallel $(nproc)

      - name: Execute C++ Test Suite & Stress Gates
        run: ctest --test-dir build --output-on-failure --schedule-random -j$(nproc)

      - name: Install Python Package
        run: pip install -e .

      - name: Execute Python & Qiskit Test Suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
        run: pytest tests/python/ -v --durations=10
