name: CI & Release Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-latest
            compiler: clang-17
            cc: clang-17
            cxx: clang++-17
          - os: windows-latest
            compiler: msvc-v143
            cc: cl
            cxx: cl

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Vulkan & Lavapipe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan-dev \
            vulkan-tools \
            glslang-tools \
            mesa-vulkan-drivers \
            libvulkan1
          # Verify Lavapipe CPU driver is available for headless execution
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> $GITHUB_ENV

      - name: Setup Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.3.268.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, glslang

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20

      - name: Build All Targets (Warnings As Errors)
        run: |
          cmake --build build --config Release --parallel

      - name: Execute Deterministic CTest Suite
        run: |
          ctest --test-dir build -C Release --verbose --output-on-failure

      - name: Prepare Package Artifacts (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/package" -Force
          Copy-Item "bin/Release/cq_hecs.exe" -Destination "dist/package/"
          Copy-Item "bin/Release/cq_hecs.dll" -Destination "dist/package/"
          Copy-Item -Recurse "include" -Destination "dist/package/"
          Copy-Item "LICENSE" -Destination "dist/package/"
          Copy-Item "README.md" -Destination "dist/package/"
          Compress-Archive -Path "dist/package/*" -DestinationPath "CQ-HECS-v2.0.0-VRTS-Vulkan-Windows-x64.zip"
          Get-FileHash "CQ-HECS-v2.0.0-VRTS-Vulkan-Windows-x64.zip" -Algorithm SHA256 | Out-File "CQ-HECS-Windows-x64.sha256"

      - name: Prepare Package Artifacts (Linux)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v') && matrix.compiler == 'gcc-13'
        run: |
          mkdir -p dist/package/bin dist/package/lib dist/package/include
          cp build/bin/cq_hecs dist/package/bin/ || cp bin/cq_hecs dist/package/bin/
          cp build/bin/libcq_hecs.so dist/package/lib/ || cp bin/libcq_hecs.so dist/package/lib/ || true
          cp -r include/* dist/package/include/
          cp LICENSE README.md dist/package/
          tar -czvf CQ-HECS-v2.0.0-VRTS-Vulkan-Linux-x64.tar.gz -C dist/package .
          sha256sum CQ-HECS-v2.0.0-VRTS-Vulkan-Linux-x64.tar.gz > CQ-HECS-Linux-x64.sha256

      - name: Upload Windows Release Asset
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: CQ-HECS-Windows-x64
          path: |
            CQ-HECS-v2.0.0-VRTS-Vulkan-Windows-x64.zip
            CQ-HECS-Windows-x64.sha256

      - name: Upload Linux Release Asset
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v') && matrix.compiler == 'gcc-13'
        uses: actions/upload-artifact@v4
        with:
          name: CQ-HECS-Linux-x64
          path: |
            CQ-HECS-v2.0.0-VRTS-Vulkan-Linux-x64.tar.gz
            CQ-HECS-Linux-x64.sha256
