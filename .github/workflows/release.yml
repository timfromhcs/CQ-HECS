name: CQ-HECS Release Pipeline

on:
  push:
    tags:
      - 'v*'
    # A push to main releases the canonical version once: when no tag
    # v<scripts/version.py> exists yet, the release job creates it on the
    # pushed commit after its CI is green. Otherwise the run is a no-op.
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide tag and whether to publish
        id: tag
        run: |
          set -euo pipefail
          VERSION="$(python3 scripts/version.py)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists; nothing to release from this push"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "${TAG} does not exist; releasing ${GITHUB_SHA}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  verify-required-ci:
    name: Require green CI for the tagged SHA
    needs: resolve-tag
    if: needs.resolve-tag.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    outputs:
      ci_url: ${{ steps.ci.outputs.url }}
    steps:
      - name: Wait until ci.yml succeeded for ${{ github.sha }}
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          deadline=$((SECONDS + 4200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh run list --repo "$REPO" --workflow ci.yml \
              --commit "$SHA" --limit 50 \
              --json status,conclusion,event,databaseId,url,headSha)" || {
                echo "gh run list failed; retrying"; sleep 30; continue; }
            rc=0
            python - "$runs" <<'PY' || rc=$?
          import json
          import sys

          runs = json.loads(sys.argv[1])
          if not runs:
              print("WAIT: no ci.yml run for this SHA yet")
              sys.exit(3)
          failed = [
              r for r in runs
              if r.get("status") == "completed"
              and r.get("conclusion") not in ("success", "skipped", None)
          ]
          if failed:
              for run in failed:
                  print(f"FAILED: {run['conclusion']} {run['url']}")
              sys.exit(1)
          green = [
              r for r in runs
              if r.get("status") == "completed"
              and r.get("conclusion") == "success"
          ]
          if green:
              for run in green:
                  print(f"GREEN: {run['url']}")
              sys.exit(0)
          print("WAIT: required CI is still running")
          sys.exit(3)
          PY
            if [ "$rc" -eq 0 ]; then
              green_url="$(gh run list --repo "$REPO" --workflow ci.yml \
                --commit "$SHA" --limit 50 \
                --json status,conclusion,url \
                --jq '[.[] | select(.status == "completed" and .conclusion == "success")][0].url')"
              echo "url=$green_url" >> "$GITHUB_OUTPUT"
              echo "Required CI is green for $SHA: $green_url"
              exit 0
            fi
            if [ "$rc" -eq 1 ]; then
              echo "::error::Required CI is red for $SHA; refusing to publish"
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for required CI on $SHA"
          exit 1

  # The release publishes EXACTLY the artifacts that package.yml builds from this
  # commit (reusable workflow, same SHA): wheel, sdist, Windows onedir zip, native
  # cpu/vulkan zips and the CycloneDX SBOMs, plus a SHA256SUMS over precisely that set.
  # Nothing is rebuilt here, so the published bytes are the bytes package.yml
  # inspected and smoke-tested.
  package:
    name: Build packaging artifacts (package.yml)
    needs: [resolve-tag, verify-required-ci]
    if: needs.resolve-tag.outputs.publish == 'true'
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read

  release:
    name: Assemble and Publish Release
    needs: [resolve-tag, verify-required-ci, package]
    if: needs.resolve-tag.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI_RUN_URL: ${{ needs.verify-required-ci.outputs.ci_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Verify version consistency
        run: python scripts/check_version.py

      - name: Check tag matches the canonical version
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          VERSION="$(python scripts/version.py)"
          echo "tag=$TAG canonical=$VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match canonical version v$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download the packaging artifacts built by package.yml
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: bundle

      - name: Select exactly the release assets and write SHA256SUMS over them
        run: |
          set -euo pipefail
          VERSION="$(python scripts/version.py)"
          mkdir -p release-assets
          ASSETS=(
            "cqhecs-${VERSION}-py3-none-any.whl"
            "cqhecs-${VERSION}.tar.gz"
            "cqhecs-${VERSION}-windows-x64.zip"
            "cq-hecs-cpu-${VERSION}-windows-x64.zip"
            "cq-hecs-vulkan-${VERSION}-windows-x64.zip"
            "cqhecs-${VERSION}-wheel.cdx.json"
            "cqhecs-${VERSION}-windows-x64.cdx.json"
          )
          for asset in "${ASSETS[@]}"; do
            if [ ! -f "bundle/$asset" ]; then
              echo "::error::package.yml did not produce release asset: $asset"
              ls -l bundle/ || true
              exit 1
            fi
            # Byte-identity with what package.yml's own manifest recorded.
            want="$(grep -F "  ${asset}" bundle/SHA256SUMS | cut -d' ' -f1)"
            have="$(sha256sum "bundle/$asset" | cut -d' ' -f1)"
            if [ -z "$want" ] || [ "$want" != "$have" ]; then
              echo "::error::$asset does not match package.yml SHA256SUMS"
              exit 1
            fi
            cp "bundle/$asset" "release-assets/$asset"
          done
          python scripts/make_manifest.py release-assets --out release-assets/SHA256SUMS
          python scripts/make_manifest.py release-assets --verify release-assets/SHA256SUMS
          ls -l release-assets/

      - name: Assemble the release body
        run: |
          set -euo pipefail
          BODY="release-body.md"
          {
            echo "**Source commit:** \`${GITHUB_SHA}\`"
            echo ""
            echo "**Required CI:** ${CI_RUN_URL}"
            echo ""
            cat RELEASE_NOTES.md
            echo ""
            echo "---"
            echo ""
            echo "## SHA256 checksums (published assets)"
            echo ""
            echo '```'
            cat release-assets/SHA256SUMS
            echo '```'
          } > "$BODY"
          cat "$BODY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-assets/cqhecs-${{ steps.meta.outputs.version }}-py3-none-any.whl
            release-assets/cqhecs-${{ steps.meta.outputs.version }}.tar.gz
            release-assets/cqhecs-${{ steps.meta.outputs.version }}-windows-x64.zip
            release-assets/cq-hecs-cpu-${{ steps.meta.outputs.version }}-windows-x64.zip
            release-assets/cq-hecs-vulkan-${{ steps.meta.outputs.version }}-windows-x64.zip
            release-assets/cqhecs-${{ steps.meta.outputs.version }}-wheel.cdx.json
            release-assets/cqhecs-${{ steps.meta.outputs.version }}-windows-x64.cdx.json
            release-assets/SHA256SUMS
          # On a main push the tag does not exist yet; the release API creates
          # it on exactly the commit whose CI was verified above.
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          draft: false
          prerelease: false
          body_path: release-body.md
