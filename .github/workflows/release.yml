name: Production Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Package
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Install Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.3.250.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, glslc

      - name: Embed SPIR-V Shaders into Static Headers
        run: python scripts/embed_shaders.py

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Targets
        run: cmake --build build --config Release --parallel

      - name: Run Test Suite
        run: python -m unittest discover -s tests -v

      - name: Create Windows Distribution Bundle
        shell: pwsh
        run: .\scripts\package_release.ps1

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-zip
          path: dist/CQ-HECS-v4.5.0-Windows-x64.zip

  publish-release:
    name: Publish Official GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release-zip
          path: dist

      - name: Compute SHA-256 Checksums
        run: |
          cd dist
          sha256sum CQ-HECS-v4.5.0-Windows-x64.zip > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CQ-HECS ${{ github.ref_name }} - Official Production Release
          body_path: CHANGELOG.md
          files: |
            dist/CQ-HECS-v4.5.0-Windows-x64.zip
            dist/checksums.txt
          draft: false
          prerelease: false
