name: CQ-HECS Clean Slate Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Sign, and Publish Release v0.1.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools

      - name: Generate Release Packages, SHA256 Checksums and SPDX SBOM
        run: python scripts/generate_sbom_and_checksums.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cqhecs-0.1.0-py3-none-any.whl
            dist/cqhecs-0.1.0.tar.gz
            dist/sha256sums.txt
            dist/cqhecs-sbom.spdx.json
          generate_release_notes: false
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
