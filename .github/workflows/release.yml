name: CQ-HECS Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-required-ci:
    name: Require green CI for the tagged SHA
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    outputs:
      ci_url: ${{ steps.ci.outputs.url }}
    steps:
      - name: Wait until ci.yml succeeded for ${{ github.sha }}
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          deadline=$((SECONDS + 4200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh run list --repo "$REPO" --workflow ci.yml \
              --commit "$SHA" --limit 50 \
              --json status,conclusion,event,databaseId,url,headSha)" || {
                echo "gh run list failed; retrying"; sleep 30; continue; }
            rc=0
            python - "$runs" <<'PY' || rc=$?
          import json
          import sys

          runs = json.loads(sys.argv[1])
          if not runs:
              print("WAIT: no ci.yml run for this SHA yet")
              sys.exit(3)
          failed = [
              r for r in runs
              if r.get("status") == "completed"
              and r.get("conclusion") not in ("success", "skipped", None)
          ]
          if failed:
              for run in failed:
                  print(f"FAILED: {run['conclusion']} {run['url']}")
              sys.exit(1)
          green = [
              r for r in runs
              if r.get("status") == "completed"
              and r.get("conclusion") == "success"
          ]
          if green:
              for run in green:
                  print(f"GREEN: {run['url']}")
              sys.exit(0)
          print("WAIT: required CI is still running")
          sys.exit(3)
          PY
            if [ "$rc" -eq 0 ]; then
              green_url="$(gh run list --repo "$REPO" --workflow ci.yml \
                --commit "$SHA" --limit 50 \
                --json status,conclusion,url \
                --jq '[.[] | select(.status == "completed" and .conclusion == "success")][0].url')"
              echo "url=$green_url" >> "$GITHUB_OUTPUT"
              echo "Required CI is green for $SHA: $green_url"
              exit 0
            fi
            if [ "$rc" -eq 1 ]; then
              echo "::error::Required CI is red for $SHA; refusing to publish"
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for required CI on $SHA"
          exit 1

  release:
    name: Build and Publish Release
    needs: verify-required-ci
    runs-on: ubuntu-latest
    env:
      CI_RUN_URL: ${{ needs.verify-required-ci.outputs.ci_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify version consistency
        run: python scripts/check_version.py

      - name: Check tag matches the canonical version
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(python scripts/version.py)"
          echo "tag=$TAG canonical=$VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match canonical version v$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools build

      - name: Build wheel and sdist
        run: |
          set -euo pipefail
          python -m build
          ls -l dist/

      - name: Smoke test the built wheel in a clean environment
        run: |
          set -euo pipefail
          python -m venv /tmp/relvenv
          /tmp/relvenv/bin/pip install --upgrade pip
          WHEEL="$(ls dist/*.whl | head -1)"
          /tmp/relvenv/bin/pip install "$WHEEL"
          /tmp/relvenv/bin/cq-hecs --help
          /tmp/relvenv/bin/cq-hecs version
          /tmp/relvenv/bin/cq-hecs doctor
          # A tiny run must succeed and emit one valid JSON document.
          /tmp/relvenv/bin/cq-hecs --format json run name:bell --shots 128 \
            > /tmp/run.json
          /tmp/relvenv/bin/python - <<'PY'
          import json
          with open("/tmp/run.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert payload["schema_version"], "missing schema_version"
          assert payload["result"]["counts"], "no counts returned"
          print("wheel smoke test OK:", payload["result"]["path"])
          PY

      # The notes must exist before the checksum generator runs, otherwise the
      # published checksum file cannot cover every release asset.
      - name: Assemble release notes for the tagged version
        run: |
          set -euo pipefail
          VERSION="$(python scripts/version.py)"
          NOTES="dist/RELEASE_NOTES_v${VERSION}.md"
          {
            echo "**Source commit:** \`${GITHUB_SHA}\`"
            echo ""
            echo "**Required CI:** ${CI_RUN_URL}"
            echo ""
            cat RELEASE_NOTES.md
          } > "$NOTES"

      - name: Generate checksums and SPDX SBOM
        run: python scripts/generate_sbom_and_checksums.py

      - name: Verify every release asset exists
        run: |
          set -euo pipefail
          VERSION="$(python scripts/version.py)"
          for asset in \
            "dist/cqhecs-${VERSION}-py3-none-any.whl" \
            "dist/cqhecs-${VERSION}.tar.gz" \
            "dist/sha256sums.txt" \
            "dist/cqhecs-sbom.spdx.json" \
            "dist/RELEASE_NOTES_v${VERSION}.md" ; do
            if [ ! -f "$asset" ]; then
              echo "::error::missing release asset: $asset"
              ls -l dist/ || true
              exit 1
            fi
          done
          echo "all release assets present"

      - name: Append final SHA256 values to the release body
        run: |
          set -euo pipefail
          VERSION="$(python scripts/version.py)"
          BODY="dist/release-body.md"
          {
            cat "dist/RELEASE_NOTES_v${VERSION}.md"
            echo ""
            echo "---"
            echo ""
            echo "## SHA256 checksums (final assets)"
            echo ""
            echo '```'
            cat dist/sha256sums.txt
            echo '```'
          } > "$BODY"
          cat "$BODY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cqhecs-${{ steps.meta.outputs.version }}-py3-none-any.whl
            dist/cqhecs-${{ steps.meta.outputs.version }}.tar.gz
            dist/sha256sums.txt
            dist/cqhecs-sbom.spdx.json
            dist/RELEASE_NOTES_v${{ steps.meta.outputs.version }}.md
          generate_release_notes: false
          draft: false
          prerelease: false
          body_path: dist/release-body.md