name: Build & Publish Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools glslang-tools spirv-tools libx11-xcb-dev libxkbcommon-dev libwayland-dev mesa-vulkan-drivers

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install vulkan-sdk -y --no-progress
          $vdir = (Get-ChildItem C:\VulkanSDK -Directory -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if ($vdir) {
            echo "VULKAN_SDK=$vdir" >> $env:GITHUB_ENV
            echo "$vdir\Bin" >> $env:GITHUB_PATH
          } else {
            echo "VULKAN_SDK=C:\VulkanSDK\1.3.296.0" >> $env:GITHUB_ENV
            echo "C:\VulkanSDK\1.3.296.0\Bin" >> $env:GITHUB_PATH
          }

      - name: Build Release
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist/CQ-HECS-v4.5.0-Windows-x64/bin -Force
          Copy-Item bin/Release/cq_hecs.exe dist/CQ-HECS-v4.5.0-Windows-x64/bin/
          Copy-Item bin/Release/cq_hecs.dll dist/CQ-HECS-v4.5.0-Windows-x64/bin/
          Copy-Item bin/Release/cq_hecs.lib dist/CQ-HECS-v4.5.0-Windows-x64/bin/
          Copy-Item include dist/CQ-HECS-v4.5.0-Windows-x64/include -Recurse -Force
          Copy-Item benchmarks dist/CQ-HECS-v4.5.0-Windows-x64/benchmarks -Recurse -Force
          Copy-Item LICENSE dist/CQ-HECS-v4.5.0-Windows-x64/
          Copy-Item README.md dist/CQ-HECS-v4.5.0-Windows-x64/
          Remove-Item dist/*.zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/CQ-HECS-v4.5.0-Windows-x64/* -DestinationPath dist/CQ-HECS-v4.5.0-Windows-x64.zip -Force

      - name: Package Linux Artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/CQ-HECS-v4.5.0-Linux-x64/bin
          cp bin/cq_hecs dist/CQ-HECS-v4.5.0-Linux-x64/bin/
          [ -f bin/libcq_hecs.so ] && cp bin/libcq_hecs.so dist/CQ-HECS-v4.5.0-Linux-x64/bin/ || true
          cp -r include dist/CQ-HECS-v4.5.0-Linux-x64/
          cp -r benchmarks dist/CQ-HECS-v4.5.0-Linux-x64/
          cp LICENSE dist/CQ-HECS-v4.5.0-Linux-x64/
          cp README.md dist/CQ-HECS-v4.5.0-Linux-x64/
          rm -f dist/*.zip
          cd dist && zip -r CQ-HECS-v4.5.0-Linux-x64.zip CQ-HECS-v4.5.0-Linux-x64/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*.zip

  publish-github-release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
