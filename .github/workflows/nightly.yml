name: CQ-HECS Nightly Extended Validation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended-native:
    name: Extended native and Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install toolchain and Vulkan runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-12 libvulkan-dev \
            glslang-tools mesa-vulkan-drivers vulkan-tools libx11-xcb-dev \
            libxkbcommon-dev libwayland-dev
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-py311.txt \
            numpy qiskit qiskit-aer stim pytest psutil coverage flake8 \
            nanobind setuptools wheel
          pip install -e . --no-deps

      - name: Configure and build native targets
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCQ_BUILD_TESTS=ON -DCQ_ENABLE_AVX2=ON
          cmake --build build --parallel "$(nproc)"

      - name: Extended CTest run
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

      - name: Extended Python run
        env:
          PYTHONPATH: .
          CQ_HECS_REQUIRE_NATIVE: "1"
        run: |
          mkdir -p test-results
          python -m pytest tests/ -q --durations=15 \
            --junitxml=test-results/nightly-pytest.xml

      - name: Mutation gate
        env:
          PYTHONPATH: .
        run: python scripts/run_mutation_tests.py

      - name: Upload nightly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-evidence
          path: test-results/
          if-no-files-found: warn
