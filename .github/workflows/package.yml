name: CQ-HECS Packaging Verification

# Builds every distributable from the checked-out commit, inspects it, smoke-tests it from a
# temporary directory with the repository source off the import path, and writes a SHA-256
# manifest and CycloneDX SBOMs. It uploads workflow ARTIFACTS only. It never creates a tag,
# a GitHub release or a deployment, and needs no secret. Publishing stays in release.yml, which
# calls this workflow (workflow_call) and uploads the artifacts it produced.
#
# What this does NOT prove: a clean-machine install (hosted runners are not clean user machines
# and have SDKs installed), a non-admin interactive session on a user desktop, or any hardware.

on:
  pull_request:
    paths:
      - "cqhecs/**"
      - "scripts/package*"
      - "scripts/sbom_*"
      - "scripts/make_manifest.py"
      - "scripts/build_exe.ps1"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
      - ".github/workflows/package.yml"
  workflow_dispatch:
  # release.yml reuses this workflow so the release publishes exactly the artifacts built
  # here, from the same commit. This adds no publishing capability to this file.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Fixed build time: 2026-01-01T00:00:00Z. Makes the wheel byte-reproducible.
  SOURCE_DATE_EPOCH: "1767225600"

jobs:
  python-package:
    name: Wheel and sdist (build, inspect, clean-venv smoke, SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          set -euo pipefail
          python -m pip install -c constraints/ci-py311.txt build
          python -m build --outdir pkg
          python scripts/package_archive.py --normalize-targz pkg/cqhecs-$(python scripts/version.py).tar.gz

      - name: Inspect artifacts (required members, no secrets, no local paths)
        run: python scripts/package_inspect.py pkg/*.whl pkg/*.tar.gz --json pkg/inspect.json

      - name: Install the wheel into a clean venv and smoke it from a temp directory
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install pkg/*.whl
          unset PYTHONPATH
          python scripts/package_smoke.py --cmd "$RUNNER_TEMP/venv/bin/cq-hecs" \
            --python "$RUNNER_TEMP/venv/bin/python" --label wheel-venv \
            --expect-version "$(python scripts/version.py)" --out pkg/smoke-wheel.json

      - name: CycloneDX SBOM and licence inventory for the wheel environment
        run: |
          set -euo pipefail
          V="$(python scripts/version.py)"
          SP="$("$RUNNER_TEMP/venv/bin/python" -c 'import sysconfig;print(sysconfig.get_paths()["purelib"])')"
          python scripts/sbom_cyclonedx.py --name cqhecs --version "$V" \
            --metadata-root "$SP" --exclude cqhecs --exclude pip \
            --artifact "pkg/cqhecs-$V-py3-none-any.whl" --artifact "pkg/cqhecs-$V.tar.gz" \
            --out "pkg/cqhecs-$V-wheel.cdx.json" --licences-out "pkg/cqhecs-$V-wheel.licences.json"

      - name: Upload python package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-python
          path: pkg/
          if-no-files-found: error
          retention-days: 14

  windows-onedir:
    name: Windows onedir folder (PyInstaller, not a single-file app)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Create a clean build venv (runtime dependencies and PyInstaller only)
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\venv-build"
          & "$env:RUNNER_TEMP\venv-build\Scripts\python.exe" -m pip install -c constraints/ci-py311.txt numpy qiskit qiskit-aer
          & "$env:RUNNER_TEMP\venv-build\Scripts\python.exe" -m pip install "pyinstaller==6.22.3"

      - name: Build the onedir folder, smoke a copy of it from a temp directory, archive it
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_exe.ps1 `
            -Python "$env:RUNNER_TEMP\venv-build\Scripts\python.exe" `
            -OutDir "$env:RUNNER_TEMP\exe-out" -WorkDir "$env:RUNNER_TEMP\exe-work"

      - name: SBOM and licence inventory for the bundle
        shell: pwsh
        run: |
          $V = (python scripts/version.py).Trim()
          $SP = & "$env:RUNNER_TEMP\venv-build\Scripts\python.exe" -c "import sysconfig;print(sysconfig.get_paths()['purelib'])"
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item "$env:RUNNER_TEMP\exe-out\cqhecs-$V-windows-x64.zip" pkg\
          Copy-Item "$env:RUNNER_TEMP\exe-out\smoke-onedir.json" pkg\
          python scripts/sbom_cyclonedx.py --name cq-hecs-onedir --version $V `
            --metadata-root $SP --exclude pip --exclude setuptools --exclude pyinstaller `
            --exclude pyinstaller-hooks-contrib --exclude altgraph --exclude pefile `
            --exclude pywin32-ctypes --exclude packaging `
            --bundle-dir "$env:RUNNER_TEMP\exe-out\cq-hecs\_internal" `
            --pyz-toc "$env:RUNNER_TEMP\exe-work\cq-hecs\PYZ-00.toc" `
            --extra-component "CPython runtime|3.11|UNVERIFIED|not opened" `
            --extra-component "PyInstaller bootloader|6.22.3|GPL-2.0-or-later WITH Bootloader-exception|COPYING.txt opened" `
            --artifact "pkg\cqhecs-$V-windows-x64.zip" `
            --out "pkg\cqhecs-$V-windows-x64.cdx.json" --licences-out "pkg\cqhecs-$V-windows-x64.licences.json"

      - name: Upload onedir artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows-onedir
          path: pkg/
          if-no-files-found: error
          retention-days: 14

  windows-native:
    name: Native cq-hecs-cpu and cq-hecs-vulkan (MSVC)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          cache: true

      - name: Build both native configurations, run ctest in each, package them
        shell: pwsh
        run: |
          python -m pip install -c constraints/ci-py311.txt numpy nanobind
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package_native.ps1 `
            -OutDir "$PWD\pkg" -WorkDir "$env:RUNNER_TEMP\native-work"

      - name: Smoke each package from a temp directory
        shell: pwsh
        run: |
          $V = (python scripts/version.py).Trim()
          python scripts/package_native_smoke.py "pkg\cq-hecs-cpu-$V-windows-x64.zip" --kind cpu
          if ($LASTEXITCODE -ne 0) { throw "cpu package smoke failed" }
          # The hosted runner has no GPU: the Vulkan package is checked for load and capability
          # flags only if a loader exists; the ghz run needs a device and may legitimately fail.
          python scripts/package_native_smoke.py "pkg\cq-hecs-vulkan-$V-windows-x64.zip" --kind vulkan
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::vulkan package smoke did not pass on this runner (no GPU expected); see log" }

      - name: Upload native artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows-native
          path: pkg/
          if-no-files-found: error
          retention-days: 14

  manifest:
    name: SHA-256 manifest over all packaging artifacts
    needs: [python-package, windows-onedir, windows-native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Download all packaging artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: bundle

      - name: Write and verify the manifest
        run: |
          set -euo pipefail
          python scripts/make_manifest.py bundle --out bundle/SHA256SUMS
          python scripts/make_manifest.py bundle --verify bundle/SHA256SUMS
          cat bundle/SHA256SUMS

      - name: Upload the manifest bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-manifest
          path: bundle/
          if-no-files-found: error
          retention-days: 14
