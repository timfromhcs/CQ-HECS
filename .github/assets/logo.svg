<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#6B11FF"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6B11FF" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#070913" rx="16"/>
  
  <g transform="translate(60, 40)" filter="url(#glow)">
    <circle cx="30" cy="30" r="16" fill="url(#neonGrad)" />
    <circle cx="90" cy="30" r="16" fill="url(#neonGrad)" />
    <circle cx="60" cy="90" r="16" fill="url(#neonGrad)" />
    <line x1="30" y1="30" x2="90" y2="30" stroke="#00F2FE" stroke-width="4"/>
    <line x1="30" y1="30" x2="60" y2="90" stroke="#4FACFE" stroke-width="4"/>
    <line x1="90" y1="30" x2="60" y2="90" stroke="#6B11FF" stroke-width="4"/>
    <circle cx="60" cy="50" r="6" fill="#FFFFFF"/>
  </g>
  
  <text x="210" y="95" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="2">CQ-HECS</text>
  <text x="212" y="135" fill="url(#glowGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" letter-spacing="1.5">SOTA HYBRID STABILIZER-MPS QUANTUM ENGINE</text>
</svg>
